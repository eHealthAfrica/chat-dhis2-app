# DHIS2 2.41 configuration for the local ePIMS/chat-app e2e instance.
# TEST-ONLY values. Never reuse these credentials or the encryption password elsewhere.

# Database (matches docker-compose.dhis2.yml)
connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://dhis2-db:5432/dhis2
connection.username = dhis
connection.password = dhis
connection.schema = update

# Public URL the app and the Android emulator use (emulator reaches the host as 10.0.2.2)
server.base.url = http://localhost:8081

# Required for dataStore writes with ?encrypt=true (DHIS2-374 TC-INT-DS-008)
encryption.password = e2e-local-encryption-password-change-me
